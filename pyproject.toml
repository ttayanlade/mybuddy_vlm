[project]
name = "mybuddy_vlm"
version = "0.2.0"
description = "Find the Fruit (MyBuddy, Isaac Lab) solved zero-shot with a VLM instead of RL"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pyyaml", "pillow", "usd-core"]

[tool.setuptools]
packages = ["mybuddy_vlm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
